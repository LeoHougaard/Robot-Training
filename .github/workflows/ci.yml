name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Parse Python sources
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          files = sorted(Path(".").rglob("*.py"))
          for path in files:
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          print(f"Parsed {len(files)} Python files.")
          PY

      - name: Run deterministic autoresearch tests
        run: python -m unittest discover -s autoresearch -p "test_*.py"

      - name: Run control-center tests
        run: python -m unittest discover -s control_center -p "test_*.py"

      - name: Run deterministic policy-contract tests
        working-directory: training
        run: |
          python -m unittest test_evaluate_simple_dog_policy.py
          python -m unittest test_export_v2_policy.py

      - name: Run Onshape four-leg generator tests
        working-directory: onshape_mate_mirror
        run: python -m unittest discover -p "test_*.py"

      - name: Check Bash syntax
        run: |
          find . -type f -name "*.sh" -print0 |
            xargs -0 -n1 bash -n
